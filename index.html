<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wedding Planner · Sign In</title>
    <meta name="description" content="Beautiful wedding planning starts here">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="npc.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-ivory: #faf8f5;
            --blush: #f4e4e0;
            --blush-deep: #e8c4bc;
            --gold: #c5a059;
            --gold-light: #e8d5a3;
            --sage: #b8c5b0;
            --charcoal: #2c2c2c;
            --charcoal-light: #5a5a5a;
            --white-glass: rgba(255, 255, 255, 0.72);
            --white-glass-border: rgba(255, 255, 255, 0.45);
            --shadow-soft: 0 8px 32px rgba(128, 0, 32, 0.06);
            --shadow-elevated: 0 20px 60px rgba(128, 0, 32, 0.08);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-ivory);
            color: var(--charcoal);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        }

        /* Background decorations */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-gradient {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 12s ease-in-out infinite;
        }

        .bg-gradient-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--blush) 0%, transparent 70%);
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .bg-gradient-2 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, var(--gold-light) 0%, transparent 70%);
            bottom: -5%; right: -10%;
            animation-delay: -4s;
            opacity: 0.35;
        }
        .bg-gradient-3 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, var(--sage) 0%, transparent 70%);
            top: 40%; right: 20%;
            animation-delay: -8s;
            opacity: 0.25;
        }

        /* Floating petals */
        .petal {
            position: absolute;
            width: 12px; height: 18px;
            background: var(--blush-deep);
            border-radius: 50% 0 50% 50%;
            opacity: 0.15;
            animation: petal-fall 18s linear infinite;
        }
        .petal:nth-child(2) { left: 20%; animation-delay: -3s; width: 8px; height: 12px; opacity: 0.1; }
        .petal:nth-child(3) { left: 70%; animation-delay: -7s; width: 10px; height: 15px; opacity: 0.12; }
        .petal:nth-child(4) { left: 85%; animation-delay: -11s; width: 14px; height: 20px; opacity: 0.08; }
        .petal:nth-child(5) { left: 45%; animation-delay: -15s; width: 9px; height: 13px; opacity: 0.1; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15px, -20px) scale(1.05); }
            66% { transform: translate(-10px, 10px) scale(0.95); }
        }

        @keyframes petal-fall {
            0% { transform: translateY(-60px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(calc(100vh + 60px)) rotate(360deg); opacity: 0; }
        }

        /* Main container */
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header / Language */
        .auth-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(197, 160, 89, 0.25);
        }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 15px;
            color: var(--charcoal);
            letter-spacing: 0.02em;
        }

        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--white-glass);
            border: 1px solid var(--white-glass-border);
            border-radius: 20px;
            padding: 4px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .lang-btn {
            border: none;
            background: transparent;
            font-size: 11px;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--charcoal-light);
            font-family: 'Inter', sans-serif;
        }

        .lang-btn.active {
            background: #fff;
            color: var(--charcoal);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        /* Hero illustration */
        .hero-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 28px;
        }

        .hero-illustration {
            width: 200px;
            height: 200px;
            position: relative;
            margin-bottom: 28px;
        }

        .hero-phone {
            width: 120px;
            height: 200px;
            background: linear-gradient(145deg, #fff 0%, #f9f7f4 100%);
            border-radius: 22px;
            border: 2px solid #e8e4df;
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%) rotate(-3deg);
            box-shadow: var(--shadow-elevated), inset 0 1px 0 rgba(255,255,255,0.8);
            overflow: hidden;
            animation: phone-float 6s ease-in-out infinite;
        }

        @keyframes phone-float {
            0%, 100% { transform: translate(-50%, -50%) rotate(-3deg) translateY(0); }
            50% { transform: translate(-50%, -50%) rotate(-3deg) translateY(-6px); }
        }

        .hero-phone-screen {
            margin: 8px;
            height: calc(100% - 16px);
            border-radius: 14px;
            background: linear-gradient(160deg, #fdf2f4 0%, #faf8f5 50%, #f0ebe4 100%);
            display: flex;
            flex-direction: column;
            padding: 12px 8px;
            gap: 6px;
        }

        .phone-bar { height: 4px; border-radius: 2px; background: var(--blush-deep); opacity: 0.4; }
        .phone-bar:nth-child(2) { width: 60%; background: var(--gold-light); }
        .phone-bar:nth-child(3) { width: 80%; background: var(--sage); opacity: 0.3; }
        .phone-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--blush); margin: 4px auto; }
        .phone-line { height: 3px; border-radius: 2px; background: #e8e4df; margin-top: 4px; }
        .phone-line:nth-child(6) { width: 70%; }

        .hero-floral-1, .hero-floral-2 {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
        }
        .hero-floral-1 {
            width: 60px; height: 60px;
            background: radial-gradient(circle, var(--blush) 30%, transparent 70%);
            top: 10px; right: 10px;
            animation: float 8s ease-in-out infinite;
        }
        .hero-floral-2 {
            width: 45px; height: 45px;
            background: radial-gradient(circle, var(--sage) 30%, transparent 70%);
            bottom: 20px; left: 15px;
            animation: float 10s ease-in-out infinite reverse;
        }

        .hero-headline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 400;
            line-height: 1.3;
            text-align: center;
            color: var(--charcoal);
            letter-spacing: -0.01em;
            max-width: 320px;
        }

        .hero-headline[data-lang="zh"] {
            font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
            font-size: 23px;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.5;
        }

        .hero-desc {
            font-size: 13px;
            line-height: 1.7;
            color: var(--charcoal-light);
            text-align: center;
            max-width: 300px;
            margin-top: 12px;
            font-weight: 300;
        }

        .hero-desc[data-lang="zh"] {
            font-size: 12.5px;
            line-height: 1.8;
            letter-spacing: 0.03em;
        }

        /* Auth card */
        .auth-card {
            width: 100%;
            background: var(--white-glass);
            border: 1px solid var(--white-glass-border);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeInUp 0.8s ease-out 0.15s both;
        }

        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 52px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        .auth-btn:active {
            transform: scale(0.97);
        }

        .auth-btn-apple {
            background: var(--charcoal);
            color: #fff;
        }
        .auth-btn-apple:hover { background: #1a1a1a; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }

        .auth-btn-google {
            background: #fff;
            color: var(--charcoal);
            border: 1px solid #e8e4df;
        }
        .auth-btn-google:hover { background: #fafafa; border-color: #d4d0cc; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }

        .auth-btn-email {
            background: linear-gradient(135deg, var(--gold) 0%, #d4aa5c 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(197, 160, 89, 0.25);
        }
        .auth-btn-email:hover { box-shadow: 0 6px 24px rgba(197, 160, 89, 0.35); transform: translateY(-1px); }
        .auth-btn-email:active { transform: scale(0.97) translateY(0); }

        .auth-btn svg {
            width: 18px; height: 18px;
            flex-shrink: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 4px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e8e4df, transparent);
        }

        .divider-text {
            font-size: 11px;
            color: #bbb;
            font-weight: 400;
            text-transform: lowercase;
        }

        /* Trust section */
        .trust-section {
            text-align: center;
            padding: 24px 0 8px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .trust-stars {
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .trust-text {
            font-size: 11px;
            color: #aaa;
            font-weight: 400;
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            padding: 16px 20px 8px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .auth-footer p {
            font-size: 10.5px;
            color: #bbb;
            line-height: 1.6;
        }

        .auth-footer a {
            color: var(--charcoal-light);
            text-decoration: underline;
            text-decoration-color: #ddd;
            text-underline-offset: 2px;
        }

        .auth-footer a:hover {
            color: var(--charcoal);
            text-decoration-color: var(--gold);
        }

        /* Responsive */
        @media (max-width: 340px) {
            .auth-container { max-width: 100%; }
            .hero-headline { font-size: 22px; }
            .hero-headline[data-lang="zh"] { font-size: 20px; }
            .auth-card { padding: 22px 18px; }
            .auth-btn { height: 48px; font-size: 13px; }
        }

        @media (min-width: 768px) {
            .auth-container { max-width: 420px; }
            .hero-headline { font-size: 30px; }
            .hero-headline[data-lang="zh"] { font-size: 26px; }
            .hero-illustration { width: 220px; height: 220px; }
            .hero-phone { width: 130px; height: 216px; }
        }

        /* Smooth transitions for language switch */
        .fade-content {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .fade-content.switching {
            opacity: 0;
            transform: translateY(4px);
        }
    </style>
</head>
<body>
    <!-- Background layer -->
    <div class="bg-layer">
        <div class="bg-gradient bg-gradient-1"></div>
        <div class="bg-gradient bg-gradient-2"></div>
        <div class="bg-gradient bg-gradient-3"></div>
        <div class="petal" style="left:10%"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
    </div>

    <!-- Main content -->
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <div class="logo">
                <div class="logo-icon">💍</div>
                <span class="logo-text" id="logo-text">WedPlanner</span>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" id="btn-en" onclick="switchLang('en')">EN</button>
                <button class="lang-btn" id="btn-zh" onclick="switchLang('zh')">中文</button>
            </div>
        </div>

        <!-- Hero -->
        <div class="hero-section fade-content" id="hero-section">
            <div class="hero-illustration" id="npc-auth-scene"></div>
            <h1 class="hero-headline" id="headline">Every Beautiful Wedding Begins With One Step</h1>
            <p class="hero-desc" id="description">Organize your guests, timeline, budget, vendors, and unforgettable moments—all in one beautifully designed place.</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card fade-content" id="auth-card">
            <!-- Apple -->
            <button class="auth-btn auth-btn-apple" onclick="handleAuth('apple')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                <span id="btn-apple-text">Continue with Apple</span>
            </button>

            <!-- Google -->
            <button class="auth-btn auth-btn-google" onclick="handleAuth('google')">
                <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                <span id="btn-google-text">Continue with Google</span>
            </button>

            <!-- Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text" id="divider-text">or</span>
                <div class="divider-line"></div>
            </div>

            <!-- Email -->
            <button class="auth-btn auth-btn-email" onclick="handleAuth('email')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg>
                <span id="btn-email-text">Continue with Email</span>
            </button>
        </div>

        <!-- Trust -->
        <div class="trust-section fade-content" id="trust-section">
            <div class="trust-stars">★★★★★</div>
            <p class="trust-text" id="trust-text">Trusted by 50,000+ Happy Couples</p>
        </div>

        <!-- Footer -->
        <div class="auth-footer fade-content" id="footer-section">
            <p id="footer-text">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
        </div>
    </div>

    <script>
    const i18n = {
        en: {
            logo: 'WedPlanner',
            headline: 'Every Beautiful Wedding Begins With One Step',
            description: 'Organize your guests, timeline, budget, vendors, and unforgettable moments—all in one beautifully designed place.',
            btn_apple: 'Continue with Apple',
            btn_google: 'Continue with Google',
            btn_email: 'Continue with Email',
            divider: 'or',
            trust: 'Trusted by 50,000+ Happy Couples',
            footer: 'By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.'
        },
        zh: {
            logo: '婚礼策划',
            headline: '每一场美好的婚礼，都从这里开始',
            description: '轻松管理宾客、婚礼流程、预算、供应商与每一个重要时刻，让婚礼筹备变得简单而美好。',
            btn_apple: '使用 Apple 继续',
            btn_google: '使用 Google 继续',
            btn_email: '使用电子邮箱继续',
            divider: '或',
            trust: '超过 50,000 对新人共同信赖',
            footer: '继续即表示您同意<a href="#">《服务条款》</a>和<a href="#">《隐私政策》</a>。'
        }
    };

    let currentLang = 'en';

    function switchLang(lang) {
        if (lang === currentLang) return;
        currentLang = lang;

        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.title = lang === 'zh' ? '婚礼策划 · 登录' : 'Wedding Planner · Sign In';

        const fadeEls = document.querySelectorAll('.fade-content');
        fadeEls.forEach(el => el.classList.add('switching'));

        setTimeout(() => {
            const dict = i18n[lang];
            document.getElementById('logo-text').textContent = dict.logo;

            const headline = document.getElementById('headline');
            headline.textContent = dict.headline;
            headline.setAttribute('data-lang', lang);

            const desc = document.getElementById('description');
            desc.textContent = dict.description;
            desc.setAttribute('data-lang', lang);

            document.getElementById('btn-apple-text').textContent = dict.btn_apple;
            document.getElementById('btn-google-text').textContent = dict.btn_google;
            document.getElementById('btn-email-text').textContent = dict.btn_email;
            document.getElementById('divider-text').textContent = dict.divider;
            document.getElementById('trust-text').textContent = dict.trust;
            document.getElementById('footer-text').innerHTML = dict.footer;

            fadeEls.forEach(el => el.classList.remove('switching'));
        }, 250);
    }

    function handleAuth(provider) {
        window.location.href = '/dashboard';
    }
    </script>
    <script src="npc.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            NPC.authScene(document.getElementById('npc-auth-scene'));
        });
    </script>
</body>
</html>
